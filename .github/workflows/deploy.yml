name: Auto Deploy CARVLAK Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permisos para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola implementación simultánea
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto web (catálogo con fotos reales)
        uses: actions/upload-pages-artifact@v3
        with:
          # Despliega directamente el catálogo interactivo como raíz del sitio
          path: 'preview/'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
